{% extends 'base.html' %}
{% block content %}
<div class="card">
<h2>Login</h2>

{% for m in get_flashed_messages() %}
<p class="msg">{{m}}</p>
{% endfor %}

<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button>Login</button>


</form>

<p style="margin-top:10px; text-align:center;">New user? <a href="/register">Register</a></p>
</div>
{% endblock %}
