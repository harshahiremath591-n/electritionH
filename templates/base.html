<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electrician System</title>

    <link rel="stylesheet" href="/static/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        nav {
            background: rgba(0,0,0,0.85);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            font-weight: 600;
            font-size: 18px;
            color: #00c6ff;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #00c6ff;
            color: black;
        }

        .profile img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #00c6ff;
        }

        .container {
            padding: 20px;
        }
    </style>
</head>

<body>

{% if session.get('user_id') %}
<nav>

    <!-- LEFT LOGO -->
    <div class="nav-left">⚡ Electrician System</div>

    <!-- CENTER LINKS -->
    <div class="nav-links">

        <!-- COMMON -->
        <a href="/dashboard">🏠 Dashboard</a>

        <!-- ADMIN ONLY -->
        {% if session.get('role') == 'admin' %}
            <a href="/jobs">🏗 Jobs</a>
            <a href="/materials">📦 Materials</a>
            <a href="/add_task">➕ Add Task</a>
        {% endif %}

        <!-- COMMON -->
        <a href="/electricians">👷 Electricians</a>
        <a href="/reports">📊 Reports</a>
        <a href="/profile">👤 Profile</a>
        <a href="/logout">🚪 Logout</a>

    </div>

    <!-- RIGHT PROFILE -->
    <div class="profile">
        {% if user and user.profile_pic %}
            <img src="data:image/png;base64,{{ user.profile_pic }}">
        {% else %}
            <img src="https://via.placeholder.com/40">
        {% endif %}
    </div>

</nav>
{% endif %}

<!-- PAGE CONTENT -->
<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
